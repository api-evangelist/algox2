name: AlgoX2
description: 'AlgoX2 is a data streaming operating system that unifies ingestion, ordering,
  fan-out, transformation, and durable storage into a single fault-tolerant engine, positioned
  as an alternative to assembling Kafka, Flink, and Redis. Built by veterans of NYSE Pillar''s
  matching engine, the platform offers a partition-free API, compute-storage separation, a
  zero-copy runtime, and native multicast fan-out, with native support for Kafka, NATS, MQTT,
  Redis, HTTP, and WebSocket protocols and protocol bridging between them. Streams automatically
  materialize as Apache Iceberg, Delta, or Hudi tables in S3-compatible Parquet storage for
  lakehouse integration. AlgoX2 raised a $3.5M seed round led by Bessemer Venture Partners and
  serves real-time use cases including exchange and matching-engine infrastructure, market-data
  distribution, risk and surveillance, backtesting, and AI feature streaming.'
